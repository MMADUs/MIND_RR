output_dir: ".output"
ckpt_basename: "{}_best"
ckpt_format: ".pt"

random_seed: 42

data:
  num_workers: 0
  pin_memory: true
  non_blocking: true
  max_train_rows: 100000 # 100k rows
  max_val_rows: 50000 # 50k rows
  max_title_len: 40
  max_abstract_len: 130
  max_entities: 10
  max_history: 50
  num_negatives: 4 # adjust more later (currently 5 candidates)

two_tower:
  batch_size: 32
  epochs: 10
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  early_stop_patience: 3
  normalize_embeddings: false

  news_tower:
    d_model: 128
    num_heads: 4
    num_layers: 2
    d_ff: 256
    pool_hidden_dim: 64
    hf_pretrained_model_name: "microsoft/MiniLM-L12-H384-uncased"
    text_embedding_dim: null # ignore if using pretrained embedding
    use_pretrained_embedding: true
    use_entity_embedding: true
    category_embedding_dim: 32
    subcategory_embedding_dim: 32
    dropout: 0.1

  user_tower:
    d_model: 64
    num_heads: 4
    num_layers: 2
    d_ff: 256
    dropout: 0.1